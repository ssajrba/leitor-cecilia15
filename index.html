
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrada - Cecília 15 Anos</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f3f8;
      color: #292333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      color: #70449a;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 22px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .status {
      margin: 18px 0;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      background: #f0edf3;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .success { background: #d9f8e5; color: #126534; }
    .error { background: #ffe0e0; color: #a51f1f; }
    .warning { background: #fff1cc; color: #805500; }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      margin: 8px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #70449a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary {
      background: #555;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      gap: 8px;
      margin-top: 20px;
      text-align: center;
    }

    .stat {
      flex: 1;
      padding: 12px 5px;
      border-radius: 10px;
      background: #f2eff5;
    }

    .stat strong {
      display: block;
      font-size: 23px;
      color: #70449a;
    }

    .small {
      font-size: 12px;
      color: #777;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Cecília 15 anos</h1>
    <div class="subtitle">Controle de entrada dos convidados</div>

    <div id="reader"></div>

    <div id="status" class="status">
      Aguardando leitura do QR Code...
    </div>

    <button id="startButton" onclick="iniciarLeitor()">
      ATIVAR CÂMERA
    </button>

    <button id="stopButton" class="secondary"
      onclick="pararLeitor()" disabled>
      PARAR CÂMERA
    </button>

    <hr style="margin:24px 0;border:0;border-top:1px solid #eee">

    <h3>Validação manual</h3>
    <input
      id="codigoManual"
      type="text"
      placeholder="Cole aqui o conteúdo completo do QR Code"
      autocomplete="off"
    >

    <button onclick="validarManual()">
      VALIDAR CONVITE
    </button>

    <div class="small">
      Sistema de controle de entrada • Cecília 15 anos
    </div>
  </main>

  <script>
    // COLOQUE AQUI O ENDEREÇO COMPLETO DO SEU APPS SCRIPT
    const API_URL = "COLE_AQUI_A_URL_COMPLETA_DO_APPS_SCRIPT";

    let leitor = null;
    let processando = false;

    const statusEl = document.getElementById("status");

    function mostrarStatus(mensagem, tipo = "") {
      statusEl.className = "status " + tipo;
      statusEl.textContent = mensagem;
    }

    function validarFormato(codigo) {
      const partes = codigo.trim().split("|");

      return partes.length === 4 &&
        partes[0] === "CECILIA15" &&
        partes[1] === "2026-12-04" &&
        partes[2] === "20:00" &&
        /^[a-fA-F0-9]{32}$/.test(partes[3]);
    }

    function enviarValidacao(codigo) {
      if (processando) return;

      if (!validarFormato(codigo)) {
        mostrarStatus("QR CODE INVÁLIDO OU NÃO RECONHECIDO", "error");
        return;
      }

      if (!API_URL.startsWith("https://script.google.com/")) {
        mostrarStatus("Configure a URL do Apps Script no arquivo index.html.", "error");
        return;
      }

      processando = true;
      document.getElementById("startButton").disabled = true;
      mostrarStatus("Consultando convite na planilha...", "warning");

      const callback = "respostaQR_" + Date.now();
      const script = document.createElement("script");

      let finalizado = false;

      function concluir(resultado, erro = false) {
        if (finalizado) return;
        finalizado = true;

        delete window[callback];
        script.remove();
        clearTimeout(timeout);

        processando = false;
        document.getElementById("startButton").disabled = false;

        if (erro) {
          mostrarStatus("Não foi possível consultar o sistema. Verifique a conexão e tente novamente.", "error");
          return;
        }

        const texto = typeof resultado === "string"
          ? resultado
          : JSON.stringify(resultado, null, 2);

        const conteudo = texto.toUpperCase();

        if (conteudo.includes("ENTRADA AUTORIZADA")) {
          mostrarStatus("✓ ENTRADA AUTORIZADA\n\n" + texto, "success");
        } else if (
          conteudo.includes("UTILIZADO") ||
          conteudo.includes("JÁ FOI") ||
          conteudo.includes("JA FOI") ||
          conteudo.includes("DUPLICADO")
        ) {
          mostrarStatus("✕ CONVITE JÁ UTILIZADO\n\n" + texto, "error");
        } else {
          mostrarStatus(texto, "warning");
        }
      }

      window[callback] = function(resultado) {
        concluir(resultado);
      };

      const timeout = setTimeout(() => concluir(null, true), 20000);

      const separador = API_URL.includes("?") ? "&" : "?";

      script.src = API_URL + separador +
        "action=validar" +
        "&qr=" + encodeURIComponent(codigo.trim()) +
        "&callback=" + encodeURIComponent(callback);

      script.onerror = () => concluir(null, true);

      document.body.appendChild(script);
    }

    async function iniciarLeitor() {
      try {
        if (!leitor) {
          leitor = new Html5Qrcode("reader");
        }

        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("Nenhuma câmera encontrada.");
        }

        const traseira = cameras.find(c =>
          /back|rear|environment|traseira/i.test(c.label)
        );

        const camera = traseira ? traseira.id : cameras[cameras.length - 1].id;

        await leitor.start(
          camera,
          {
            fps: 10,
            qrbox: { width: 250, height: 250 }
          },
          codigo => {
            if (!processando) {
              enviarValidacao(codigo);
            }
          },
          () => {}
        );

        document.getElementById("startButton").disabled = true;
        document.getElementById("stopButton").disabled = false;

        mostrarStatus("Câmera ativa. Aponte para o QR Code do convite.");
      } catch (erro) {
        mostrarStatus("Erro ao acessar câmera: " + erro.message, "error");
      }
    }

    async function pararLeitor() {
      if (leitor && leitor.isScanning) {
        await leitor.stop();
      }

      document.getElementById("startButton").disabled = false;
      document.getElementById("stopButton").disabled = true;
    }

    function validarManual() {
      const codigo = document.getElementById("codigoManual").value.trim();

      if (!codigo) {
        mostrarStatus("Digite o conteúdo completo do QR Code.", "warning");
        return;
      }

      enviarValidacao(codigo);
    }
  </script>
</body>
</html>
